name: Build UI

on:
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build UI
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: NodeJS to Compile WebUI
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: UI/Web
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        working-directory: UI/Web
        run: npm test

      - name: Build UI
        working-directory: UI/Web
        run: npm run prod
